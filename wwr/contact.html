<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content=" Contact Rapid River Adventures to ask questions, make reservations, or learn more about our rafting experiences.">
    <meta name="author" content="Paola Trevino">
    <title> Contact Us | Rapid River Adventures</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rapid River Adventures logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-page">
        <h1>Rapid River Adventures</h1>
        <section class="company-info">
            <h2>Our office</h2>
            <p>📍 123 River Run Road, Moab, UT 84532</p>
            <p>📞 +1 (435) 555-RAFT</p>
            <p>✉️ info@rapidriveradventures.com</p>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d199794.2927664407!2d-109.85094214404437!3d38.51565017399523!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1s123%20River%20Run%20Road%2C%20Moab%2C%20UT%2084532!5e0!3m2!1ses-419!2sus!4v1770768866882!5m2!1ses-419!2sus"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>

        <section class="team">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Lead Rafting Guide">
                <figcaption>Alex Morgan – Lead Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Operations Manager">
                <figcaption>Sarah Lee – Operations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Customer Experience Manager">
                <figcaption>Daniel Cruz – Customer Experience Manager</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>
                <label for="name">name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation" required>
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion" required>
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message</label>
                <textarea name="message" id="message"></textarea>

                <label>
                    <input type="checkbox" name="subscribe">
                    Please subscribe me to monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rapid River Adventures | Paola Trevino</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
